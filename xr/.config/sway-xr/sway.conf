# Opt-in XR controls. Display modes/layouts are applied only by sway-xr start.
# Normal workstation output policy stays in the existing Sway/Kanshi configs.
for_window [app_id="^sway-xr$"] move container to output "Visitech AS VITURE 0x88888800", fullscreen enable
no_focus [app_id="^sway-xr$"]

bindsym $mod+Ctrl+x exec ~/.local/bin/sway-xr toggle
bindsym $mod+Ctrl+r exec ~/.local/bin/sway-xr recenter
bindsym $mod+Ctrl+equal exec ~/.local/bin/sway-xr larger
bindsym $mod+Ctrl+minus exec ~/.local/bin/sway-xr smaller

# Only monitor creation/removal needs an XR binding. Use the normal Super+#
# and Super+Shift+# bindings to focus workspaces and move windows.
bindsym Ctrl+Mod1+Shift+1 exec ~/.local/bin/sway-xr toggle-screen left
bindsym Ctrl+Mod1+Shift+2 exec ~/.local/bin/sway-xr toggle-screen right
