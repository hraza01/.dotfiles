"$schema" = "https://starship.rs/config-schema.json"
# Plain variant for terminals without Nerd Font glyphs (Cloud Shell browser).
# Keep in sync with starship.toml; only the symbols differ.

add_newline = false
format = """
$python\
$directory\
$git_branch\
$git_status\
$line_break\
$character"""
right_format = "$cmd_duration"

[python]
format = "[($virtualenv) ](white)"
symbol = ""
detect_extensions = []
detect_files = []
detect_folders = []

[directory]
format = "[$path](cyan)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[ on $branch](#666666)"
symbol = ""

[git_status]
format = "[ $all_status$ahead_behind](#666666)"

[cmd_duration]
min_time = 5000
format = "[$duration](yellow)"

[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❯](cyan)"
vimcmd_replace_one_symbol = "[❯](purple)"
vimcmd_replace_symbol = "[❯](purple)"
vimcmd_visual_symbol = "[❯](yellow)"
