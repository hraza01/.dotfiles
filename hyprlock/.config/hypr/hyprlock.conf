# Terminal-style lock screen, native Hyprlock authentication and session lock.
# Hyprlock label font_size uses points: 15pt is 20 logical px at 96 DPI.
$font = JetBrainsMono Nerd Font Mono
$text = rgb(e5e0e5)
$secondary = rgb(afa5af)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        # Native parallel flow; an unenrolled/unavailable reader leaves PAM usable.
        enabled = true
    }
}

background {
    monitor =
    color = rgb(000000)
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:3600000] python3 "$HOME/.config/hypr/screen-data.py" header
    color = $secondary
    font_family = $font
    font_size = 15
    position = 115, -108
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:3600000] python3 "$HOME/.config/hypr/screen-data.py" user
    color = $text
    font_family = $font
    font_size = 15
    position = 115, -175
    halign = left
    valign = top
}

label {
    monitor =
    text = password:
    color = $text
    font_family = $font
    font_size = 15
    position = 115, -202
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 384, 27
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = $text
    font_family = $font
    dots_size = 0.75
    dots_text_format = *
    dots_center = false
    dots_spacing = 0
    fade_on_empty = false
    rounding = 0
    placeholder_text =
    fail_text = $PAMFAIL
    position = 235, -202
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000:1] python3 "$HOME/.config/hypr/screen-data.py" fingerprint
    color = $secondary
    font_family = $font
    font_size = 15
    position = 115, -242
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] python3 "$HOME/.config/hypr/screen-data.py" footer
    color = $secondary
    font_family = $font
    font_size = 15
    position = -24, 24
    halign = right
    valign = bottom
}
