<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Make Barlow the default UI font for apps that resolve via fontconfig
  (Qt, Electron, many GTK apps, browsers' UI, etc.).

  monospace is intentionally left at its existing default so terminals
  keep using JetBrains Mono.

  Sizes and weights are selected in the toolkit/application settings, not
  forced here: a global weight/size rule would also change web-page text
  and could override explicitly requested heading or icon weights.
-->
<fontconfig>
  <!-- Default sans-serif -> Barlow -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Barlow</string>
    </edit>
  </match>

  <!-- Treat common UI sans aliases as Barlow too -->
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Barlow</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Barlow</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Barlow</string>
    </edit>
  </match>
</fontconfig>
