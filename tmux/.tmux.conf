# From the arch branch, adapted for remote hosts and Cloud Shell.

# General. Applications inside tmux must see tmux's terminal capabilities.
set -g mouse on
# Older hosts may lack tmux-256color terminfo; fall back rather than break apps.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g focus-events on
set -g allow-passthrough on
# Panes start $SHELL; the bash handoff exports zsh's path there.

# Prefix.
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Vi copy mode.
set-window-option -g mode-keys vi

# Session/window behavior.
set -g base-index 1
# Ending an app/project must close its client, not jump into another project.
set -g detach-on-destroy on
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g pane-base-index 1

# Historical plugins and settings; plugin changes are a separate editing pass.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Resurrect's default Ctrl+S save binding conflicts with our prefix forwarding.
set -g @resurrect-save 'S'
# Keep existing sessions on activation; restore saved layouts manually if needed.
set -g @continuum-restore 'off'

# Minimal bottom bar: window numbers and names, no session/host/clock or ornaments.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style 'none,fg=#aaaaaa,bg=default'
set -g status-left ''
set -g status-right ''
set -g status-left-length 0
# Continuum adds an invisible save callback here; no labels or clock are shown.
set -g status-right-length 40

set -g window-status-separator ''
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-style 'none,fg=#aaaaaa,bg=default'
set -g window-status-current-style 'none,fg=#ffffff,bg=#555555'
set -g window-status-activity-style none
set -g window-status-bell-style none
set -g window-status-last-style none

# Subtle monochrome dividers; terminal content keeps Ghostty's background.
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style 'fg=#555555,bg=default'
set -g pane-active-border-style 'fg=#aaaaaa,bg=default'
set -g display-panes-colour '#555555'
set -g display-panes-active-colour '#ffffff'
set -g message-style 'fg=#b2b2b2,bg=#000000'
set -g message-command-style 'fg=#b2b2b2,bg=#000000'
set -g mode-style 'fg=#ffffff,bg=#555555'

# Missing plugins can be installed with prefix + I after TPM is cloned.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'

# Keep our bindings after plugin initialization so they win on reload.
bind C-s send-prefix
unbind r
bind r source-file ~/.tmux.conf
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Lowercase navigates; uppercase resizes, resolving the historical collision.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Match the previous terminal's no-confirmation close behavior.
bind x kill-pane
bind & kill-window
